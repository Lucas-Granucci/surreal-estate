[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "surreal-estate"
version = "0.1.0"
description = "Evidence-first property research with local Ollama planning"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "SQLAlchemy>=2.0,<3", "PyYAML>=6,<7", "python-dotenv>=1,<2", "markdown-it-py>=3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.scripts]
surreal-estate = "surreal_estate.cli:main"

[tool.setuptools.packages.find]
include = ["surreal_estate*"]

[tool.setuptools.package-data]
surreal_estate = ["policy/*.yaml", "evals/*.json", "webapp/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
