name: Deploy showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check frontend syntax
        run: node --check surreal_estate/webapp/static/app.js
      - name: Build public showcase
        run: python scripts/build_showcase.py --output dist/showcase
      - name: Upload static site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/showcase

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy public showcase
        id: deployment
        uses: actions/deploy-pages@v4
