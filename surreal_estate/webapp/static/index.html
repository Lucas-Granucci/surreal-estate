<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SurrealEstate — Know the place</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a href="#main" class="skip">Skip to content</a>
    <header class="app-header">
      <button class="brand" data-action="home" aria-label="SurrealEstate home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 19V8l9-5 9 5v11H3Zm9-16v16M3 8l9 5 9-5" /></svg
        >SurrealEstate
      </button>
      <nav aria-label="Main">
        <button class="text-button" data-action="saved">Saved reports</button
        ><button class="secondary" data-action="new">
          New research <span aria-hidden="true">↗</span>
        </button>
      </nav>
    </header>
    <main id="main" tabindex="-1"></main>
    <dialog id="detail-dialog" aria-labelledby="dialog-title">
      <div id="dialog-body"></div>
    </dialog>
    <div
      id="announcement"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></div>
    <noscript
      >Enable JavaScript to research an address and open saved
      reports.</noscript
    >
  </body>
</html>
